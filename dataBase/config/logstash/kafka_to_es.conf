input {
  kafka {
    bootstrap_servers => "kafka:9093"
    topics => ["copper_tick", "gas_tick", "gold_tick", "oil_tick", "silver_tick"]
    group_id => "logstash_finance_group"
    auto_offset_reset => "earliest"
    codec => json
  }
}
filter {
  date { match => [ "timestamp", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss" ] target => "@timestamp" }
  mutate { convert => { "price" => "float" "volume" => "float" "bid" => "float" "ask" => "float" "spread" => "float" "volatility" => "float" "high" => "float" "low" => "float" } }
  ruby {
    code => '
      p = event.get("price").to_f
      s = event.get("spread").to_f
      b = event.get("bid").to_f
      a = event.get("ask").to_f
      event.set("spread_pct", (s / p * 100).round(6)) if p > 0
      event.set("mid_price", ((b + a) / 2.0).round(6)) if b > 0 && a > 0
    '
  }
  mutate { remove_field => [ "message", "@version", "event" ] }
}
output {
  elasticsearch { hosts => ["elasticsearch:9200"] index => "finance_realtime_metrics" document_id => "%{symbol}-%{timestamp}" }
}
