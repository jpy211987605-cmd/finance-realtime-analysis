services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - bigdata
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  hadoop-namenode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-namenode
    user: root
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    command: >
      bash -c "echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:8020</value></property><property><name>hadoop.proxyuser.root.hosts</name><value>*</value></property><property><name>hadoop.proxyuser.root.groups</name><value>*</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>dfs.namenode.name.dir</name><value>file:///hadoop/dfs/name</value></property><property><name>dfs.replication</name><value>1</value></property><property><name>dfs.namenode.http-address</name><value>0.0.0.0:9870</value></property><property><name>dfs.namenode.https-address</name><value>0.0.0.0:9871</value></property><property><name>dfs.namenode.rpc-address</name><value>hadoop-namenode:8020</value></property></configuration>' > /opt/hadoop/etc/hadoop/hdfs-site.xml && hdfs namenode -format -force && hdfs namenode"
    networks:
      - bigdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  hadoop-datanode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-datanode
    user: root
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    command: >
      bash -c "echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:8020</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>dfs.datanode.data.dir</name><value>file:///hadoop/dfs/data</value></property><property><name>dfs.namenode.http-address</name><value>hadoop-namenode:9870</value></property><property><name>dfs.namenode.rpc-address</name><value>hadoop-namenode:8020</value></property></configuration>' > /opt/hadoop/etc/hadoop/hdfs-site.xml && sleep 15 && hdfs datanode"
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    networks:
      - bigdata

  hive-metastore-postgresql:
    image: postgres:13
    container_name: hive-metastore-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore
    volumes:
      - hive_metastore_postgresql:/var/lib/postgresql/data
    networks:
      - bigdata

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    user: root
    ports:
      - "9083:9083"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/usr/local/openjdk-8
      - HIVE_HOME=/opt/hive
      - HIVE_CONF_DIR=/opt/hive/conf
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HIVE_LOG_LEVEL=DEBUG
      - HADOOP_HEAPSIZE=1024
      - HIVE_METASTORE_HEAPSIZE=1024
    volumes:
      - ./lib/postgresql-42.7.4.jar:/opt/hive/lib/postgresql-42.7.4.jar
      - ./lib/guava-27.0-jre.jar:/opt/hive/lib/guava-27.0-jre.jar
    entrypoint: ["sh", "-c", "rm -f /opt/hive/lib/guava-19.0.jar /opt/hadoop/share/hadoop/common/lib/guava-11.0.2.jar /opt/hadoop/share/hadoop/hdfs/lib/guava-11.0.2.jar && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:8020</value></property><property><name>hadoop.proxyuser.root.hosts</name><value>*</value></property><property><name>hadoop.proxyuser.root.groups</name><value>*</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>javax.jdo.option.ConnectionURL</name><value>jdbc:postgresql://hive-metastore-postgresql:5432/metastore</value></property><property><name>javax.jdo.option.ConnectionDriverName</name><value>org.postgresql.Driver</value></property><property><name>javax.jdo.option.ConnectionUserName</name><value>hive</value></property><property><name>javax.jdo.option.ConnectionPassword</name><value>hive</value></property><property><name>hive.metastore.uris</name><value>thrift://hive-metastore:9083</value></property><property><name>hive.metastore.warehouse.dir</name><value>/user/hive/warehouse</value></property><property><name>hive.metastore.schema.verification</name><value>false</value></property><property><name>hive.metastore.event.db.notification.api.auth</name><value>false</value></property><property><name>datanucleus.autoCreateSchema</name><value>false</value></property><property><name>datanucleus.fixedDatastore</name><value>false</value></property></configuration>' > /opt/hive/conf/hive-site.xml && sleep 30 && schematool -dbType postgres -initSchema && hive --service metastore"]
    depends_on:
      hive-metastore-postgresql:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    networks:
      - bigdata

  hive-server:
    image: apache/hive:3.1.3
    container_name: hive-server
    user: root
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/usr/local/openjdk-8
      - HIVE_HOME=/opt/hive
      - HIVE_CONF_DIR=/opt/hive/conf
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_HEAPSIZE=1024
      - HIVE_SERVER2_HEAPSIZE=1024
    volumes:
      - ./lib/postgresql-42.7.4.jar:/opt/hive/lib/postgresql-42.7.4.jar
      - ./lib/guava-27.0-jre.jar:/opt/hive/lib/guava-27.0-jre.jar
    entrypoint: ["sh", "-c", "rm -f /opt/hive/lib/guava-19.0.jar /opt/hadoop/share/hadoop/common/lib/guava-11.0.2.jar /opt/hadoop/share/hadoop/hdfs/lib/guava-11.0.2.jar && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:8020</value></property><property><name>hadoop.proxyuser.root.hosts</name><value>*</value></property><property><name>hadoop.proxyuser.root.groups</name><value>*</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml && echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?><configuration><property><name>javax.jdo.option.ConnectionURL</name><value>jdbc:postgresql://hive-metastore-postgresql:5432/metastore</value></property><property><name>javax.jdo.option.ConnectionDriverName</name><value>org.postgresql.Driver</value></property><property><name>javax.jdo.option.ConnectionUserName</name><value>hive</value></property><property><name>javax.jdo.option.ConnectionPassword</name><value>hive</value></property><property><name>hive.metastore.uris</name><value>thrift://hive-metastore:9083</value></property><property><name>hive.metastore.warehouse.dir</name><value>/user/hive/warehouse</value></property><property><name>hive.execution.engine</name><value>mr</value></property><property><name>hive.server2.thrift.port</name><value>10000</value></property><property><name>hive.server2.thrift.bind.host</name><value>0.0.0.0</value></property><property><name>hive.metastore.event.db.notification.api.auth</name><value>false</value></property></configuration>' > /opt/hive/conf/hive-site.xml && sleep 60 && hive --service hiveserver2"]
    depends_on:
      hive-metastore:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    networks:
      - bigdata

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bigdata

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ../config/logstash/kafka_to_es.conf:/usr/share/logstash/pipeline/logstash.conf
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - bigdata

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - bigdata

  spark-master:
    image: apache/spark:3.3.3
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - HADOOP_HOME=/opt/hadoop
      - HIVE_HOME=/opt/hive
    volumes:
      - ../src/python:/opt/spark/work-dir/src/python
      - ../config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./lib/postgresql-42.7.4.jar:/opt/spark/jars/postgresql-42.7.4.jar
      - ./lib/guava-27.0-jre.jar:/opt/spark/jars/guava-27.0-jre.jar
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - bigdata
    depends_on:
      - hive-metastore

  spark-worker:
    image: apache/spark:3.3.3
    container_name: spark-worker
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - HADOOP_HOME=/opt/hadoop
      - HIVE_HOME=/opt/hive
    volumes:
      - ../src/python:/opt/spark/work-dir/src/python
      - ../config/hive/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./lib/postgresql-42.7.4.jar:/opt/spark/jars/postgresql-42.7.4.jar
      - ./lib/guava-27.0-jre.jar:/opt/spark/jars/guava-27.0-jre.jar
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
      - hive-metastore
    networks:
      - bigdata

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_postgresql:
  elasticsearch_data:

networks:
  bigdata:
    driver: bridge
    name: bigdata
